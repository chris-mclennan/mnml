<!--
  Beatport B icon — the standalone circular logo that sits to the left of
  the "beatport" wordmark in Beatport-Black-Logo.svg. Extracted for use as
  a monochrome font glyph (baked into MnmlSymbols.ttf) so the mnml mixr
  statusline chip can identify Beatport as the active source.

  Source: Beatport-Black-Logo.svg (Adobe Illustrator export, 1920x1080).
  The wordmark's 8 letter-shape paths are discarded; only the icon's
  compound path (with the small hole above the disc) survives.

  ViewBox tightened to the icon's bounding box + a small padding so it
  renders full-cell in a font glyph.
-->
