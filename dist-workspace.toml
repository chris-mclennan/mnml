[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app.
#
# 2026-08-07 — dropped `msi` (Windows GUI installer). Developer users
# get mnml via `cargo install`, Homebrew, winget, or the tarball —
# the Windows .msi was heavyweight for what's a terminal editor and
# duplicates winget's job. Shell + PowerShell curl-installers stay
# because they're universal one-liners with no packaging overhead.
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# 2026-08-02 — Windows target flipped from `x86_64-pc-windows-msvc` to
# `x86_64-pc-windows-gnu` (MinGW). Upstream ghostty explicitly marks
# `x86_64-windows-msvc` as "doesn't work yet" for libghostty-vt in
# their own CI; the SUPPORTED combo is windows-gnu. Under msvc we hit
# a runtime STATUS_ACCESS_VIOLATION in `ghostty_terminal_vt_write`
# regardless of build flags (verified across ~7 CI cycles). The gnu
# path uses the MinGW-w64 GCC toolchain pre-installed on
# windows-latest runners at `C:\ProgramData\mingw64\`.
#
# `aarch64-pc-windows-msvc` is OUT. Two prior attempts:
#   v0.1.3 — Linux container + cargo-xwin: ring's clang `/imsvc`
#            invocation fails. Dropped.
#   v0.1.4 — re-added on native `windows-11-arm` runner (GA 2026-01-29).
#            Rust compile succeeds, but the MSI step fails: WiX
#            (`candle`) is NOT pre-installed on windows-11-arm runners
#            (whereas `windows-2022` has it). Dropped again.
# ARM Windows users can install the x86_64 MSI (runs on ARM Windows
# under Microsoft's emulation), or grab the raw
# x86_64-pc-windows-gnu.zip. Native arm64 returns whenever either
# (a) cargo-dist exposes a per-target installer override (no MSI on
# arm64-windows, keep .zip) or (b) windows-11-arm runners get WiX
# bundled, whichever happens first.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]
# Which actions to run on pull requests
pr-run-mode = "upload"
# YAML snippet injected into every build job's `steps:` array,
# *before* the build runs. We use it to check out the sibling repos
# that mnml's Cargo.toml references by path (`../fim-engine`).
# Lives at `.github/build-setup.yml` (one dir
# above `.github/workflows/`) so GitHub doesn't try to interpret
# it as a standalone workflow. dist resolves the path relative to
# `.github/workflows/`.
github-build-setup = "../build-setup.yml"
# Permit manual edits to the generated CI file — `dist plan` would
# otherwise refuse to run when release.yml drifts. We hand-add the
# sibling-clone step to the plan / build-global-artifacts / host
# jobs (cargo-dist only auto-injects `github-build-setup` into
# build-local-artifacts), so the file is intentionally out of sync.
allow-dirty = ["ci"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# 2026-08-07 — removed [dist.mac-pkg-config]. macOS users install
# mnml via `cargo install`, `brew install mnml/tap/mnml`, or the
# tarball. A .pkg (Apple installer) is GUI-installer aesthetic —
# wrong shape for a TUI editor whose audience is comfortable in a
# terminal already.
