<!-- demo/web/term-head.html: put in the head of ttyd's own page by the
     attract runner. The faces mnml draws with, served from /fonts/:
     JetBrains Mono for text, Symbols Nerd Font Mono for the rail and
     chrome icons (the Nerd Font private-use blocks), MnmlSymbols for
     mnml's own block (U+F1B00-U+F20FF: the Claude and Codex marks, the
     tree connectors, the terminal icon). ttyd's scripts arrive as
     type="text/x-ttyd" and start here once all five faces are loaded,
     so xterm.js measures its cell from JetBrains Mono, not a fallback. -->
<style>
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Regular.woff2) format("woff2"); font-weight: 400; font-style: normal; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Bold.woff2) format("woff2"); font-weight: 700; font-style: normal; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Italic.woff2) format("woff2"); font-weight: 400; font-style: italic; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-BoldItalic.woff2) format("woff2"); font-weight: 700; font-style: italic; }
@font-face { font-family: "Symbols Nerd Font Mono"; src: url(/fonts/SymbolsNerdFontMono-Regular.woff2) format("woff2"); }
@font-face { font-family: "MnmlSymbols"; src: url(/fonts/MnmlSymbols.woff2) format("woff2"); }
html, body { background: #1e222a; }
</style>
<script>
(function () {
  const faces = [
    '400 13px "JetBrains Mono"', '700 13px "JetBrains Mono"', 'italic 400 13px "JetBrains Mono"',
    'italic 700 13px "JetBrains Mono"', '13px "Symbols Nerd Font Mono"', '13px "MnmlSymbols"',
  ];
  // ttyd's `-t fontFamily=` keeps only the first family of a list, so
  // the whole stack is set here once the terminal exists: icons the text
  // face lacks fall through to the Nerd Font, then to MnmlSymbols.
  const STACK = '"JetBrains Mono", "Symbols Nerd Font Mono", "MnmlSymbols", monospace';
  function startTtyd() {
    for (const old of document.querySelectorAll('script[type="text/x-ttyd"]')) {
      const s = document.createElement("script");
      for (const a of old.attributes) if (a.name !== "type") s.setAttribute(a.name, a.value);
      s.text = old.text;
      old.replaceWith(s);
    }
    reportCell();
  }
  // The outer page sizes this frame to exactly 200x60 of the terminal's
  // own cells, so it needs the cell: posted once the terminal has one.
  function reportCell() {
    let tries = 0;
    const t = setInterval(() => {
      const term = window.term;
      if (term && term.options && term.options.fontFamily !== STACK) term.options.fontFamily = STACK;
      const dims = term && term._core && term._core._renderService && term._core._renderService.dimensions;
      const cell = dims && dims.css && dims.css.cell;
      if (cell && cell.width > 0 && cell.height > 0) {
        clearInterval(t);
        // What ttyd's fit addon takes off the frame before dividing by
        // the cell: the terminal element's padding and the scrollbar.
        const post = () => {
          const c = term._core._renderService.dimensions.css.cell;
          const cs = getComputedStyle(term.element);
          const px = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
          const py = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
          const sb = term.options.scrollback === 0 ? 0 : (term._core.viewport ? term._core.viewport.scrollBarWidth || 0 : 0);
          parent.postMessage({ type: "mnml-demo-cell", w: c.width, h: c.height, padX: px + sb, padY: py, cols: term.cols, rows: term.rows, size: term.options.fontSize }, location.origin);
        };
        term.onResize(post);
        // The outer page picks the font size that fits 200x60 in its
        // window; the cell that results is posted back.
        window.addEventListener("message", (e) => {
          if (e.origin !== location.origin || !e.data || e.data.type !== "mnml-demo-font") return;
          term.options.fontSize = e.data.size;
          // A size change rebuilds the glyph atlas; rebuilt mid-change, the
          // icon faces were drawn as the text face's missing-glyph box.
          setTimeout(() => { if (term.clearTextureAtlas) term.clearTextureAtlas(); term.refresh(0, term.rows - 1); post(); }, 60);
        });
        post();
      } else if (++tries > 200) clearInterval(t);
    }, 50);
  }
  document.addEventListener("DOMContentLoaded", () => {
    Promise.all(faces.map((f) => document.fonts.load(f))).catch(() => {}).finally(startTtyd);
  });
})();
</script>
