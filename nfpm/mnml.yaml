# nfpm package config — .github/workflows/package-linux.yml builds the .deb
# and .rpm from the release tarballs with it. ARCH and VERSION come from the
# environment at nfpm's config-parse time.
name: mnml
arch: ${ARCH}
version: ${VERSION}
maintainer: Chris McLennan <chrismclennan@mac.com>
description: |
  A NvChad-style terminal IDE — vim or standard editing, LSP, git, an
  embedded HTTP client, terminal and AI panes, a headless test harness.
homepage: https://mnml.sh
license: MIT OR Apache-2.0
section: editors
priority: optional
contents:
  - src: staging/mnml
    dst: /usr/bin/mnml
    file_info:
      mode: 0755
  # The offline Jira and Bitbucket `mnml --demo` starts from the
  # binary's own directory — so beside it, as the archive has them.
  - src: staging/mnml-fake-jira
    dst: /usr/bin/mnml-fake-jira
    file_info:
      mode: 0755
  - src: staging/mnml-fake-bitbucket
    dst: /usr/bin/mnml-fake-bitbucket
    file_info:
      mode: 0755
  # The curated Lua script set, laid where `shippedRoot` looks first on
  # a system install: the binary is `/usr/bin/mnml`, so
  # `<exe dir>/../share/mnml/lua` is this. Staged out of the release
  # tarball beside the binary, so the package carries exactly what the
  # archive does. Without it the SCRIPTS section's Marketplace tab is
  # empty for everyone who installed from a `.deb` or an `.rpm`.
  - src: staging/lua
    dst: /usr/share/mnml/lua
    type: tree
  # MnmlSymbols.ttf, the face mnml's own block is drawn from (the Claude
  # and Codex marks, the tree connectors, the terminal icon). Laid where
  # the archive has it so a package and an unpacked tarball agree; the
  # user still has to hand it to their terminal, which is what
  # `font-codepoint-map = U+F1B00-U+F20FF=MnmlSymbols` does.
  - src: staging/fonts/MnmlSymbols.ttf
    dst: /usr/share/mnml/fonts/MnmlSymbols.ttf
  # The mnml catalogue — the INTEGRATIONS section's Marketplace tab
  # default source. `<exe dir>/../share/mnml/marketplace.zon` is what a
  # system-installed `/usr/bin/mnml` probes; without it the tab lists
  # nothing for everyone who installed from a `.deb` or an `.rpm`.
  - src: staging/marketplace.zon
    dst: /usr/share/mnml/marketplace.zon
  - src: LICENSE-MIT
    dst: /usr/share/doc/mnml/LICENSE-MIT
  - src: LICENSE-APACHE
    dst: /usr/share/doc/mnml/LICENSE-APACHE
