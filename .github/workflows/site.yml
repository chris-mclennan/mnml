# The website (site/, plain Astro): build it and run the smoke test —
# dead internal links and #fragments, and a HEAD on every release
# download URL the built pages carry — on every push touching site/**.
#
# The build reads docs/*.md (the generated reference pages) and
# README.md (the winget line), so those wake it too. No deploy step:
# where the site is hosted is decided outside this workflow.
name: site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/CONFIG.md"
      - "docs/KEYMAP_PROFILES.md"
      - "docs/commands.md"
      - "docs/LUA.md"
      - "docs/SDK.md"
      - "README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/CONFIG.md"
      - "docs/KEYMAP_PROFILES.md"
      - "docs/commands.md"
      - "docs/LUA.md"
      - "docs/SDK.md"
      - "README.md"
      - ".github/workflows/site.yml"
  # Daily: the download probes catch a release that was deleted or
  # re-tagged without a site edit.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # npm 10 ships with Node 22 and wrote site/package-lock.json;
          # npm 11's lock leaves out astro's optional sharp packages and
          # `npm ci` then refuses it.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json
      - name: Install site deps
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Smoke — internal links + download HEAD
        working-directory: site
        # PR builds skip the download probes (rate-limit noise on branches);
        # main and the schedule hit the real URLs.
        env:
          SKIP_DOWNLOAD_CHECKS: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npm run smoke
