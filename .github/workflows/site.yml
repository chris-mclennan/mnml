# #860 — build the site + run the smoke test (dead-link + download-URL
# HEAD probes) on every push touching `site/**` and on PRs. Prevents
# the manual-writer drift + renamed-slug bugs from shipping.
#
# The download-HEAD checks hit GitHub `releases/latest/download/…`
# URLs. GitHub occasionally rate-limits or 5xx's transiently — the
# smoke script distinguishes hard 404s (fail the run) from other
# statuses (soft warn, don't fail).
name: site
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'Cargo.toml'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'Cargo.toml'
      - '.github/workflows/site.yml'
  # Run daily too — the download-URL probes catch cases where a
  # release was deleted / re-tagged without a site edit.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# CodeQL actions/missing-workflow-permissions — explicit least
# privilege. Cross-repo work here uses a dedicated PAT, so the
# job's own GITHUB_TOKEN needs read only. Without a block the job
# inherits the repo default, which can be write.
permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json
      - name: Install site deps
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Build site
        working-directory: site
        run: npm run build
      - name: Detect release commit
        id: relcheck
        # 2026-08-22 — the release-plz chore commit bumps Cargo.toml and
        # trips this workflow, but release-plz's own build hasn't
        # published binaries to /releases/latest/download/* yet, so the
        # smoke check 404s and fails the whole release. Skip the download
        # probes on any commit whose message begins with `chore: release`.
        # The daily scheduled cron still catches genuine broken links.
        run: |
          msg=$(git log -1 --format=%B)
          if echo "$msg" | head -1 | grep -Eq '^chore(\([^)]*\))?: release'; then
            echo "is_release=1" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke — internal links + download HEAD
        working-directory: site
        # PR builds run without download probes to avoid rate-limiting
        # noise on branches; release commits skip them for the same
        # reason (binaries lag the commit by minutes); main + scheduled
        # runs hit the real URLs.
        env:
          SKIP_DOWNLOAD_CHECKS: ${{ (github.event_name == 'pull_request' || steps.relcheck.outputs.is_release == '1') && '1' || '' }}
        run: npm run smoke
