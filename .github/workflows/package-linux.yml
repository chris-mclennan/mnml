name: Package .deb + .rpm

# After a release: download the two Linux tarballs, take the binary out,
# and build .deb + .rpm for amd64 and arm64 with nfpm (nfpm/mnml.yaml).
# Uploaded to the same release, as mnml-<triple>.deb / .rpm — versionless,
# so releases/latest/download/<name> is a stable URL.

on:
  # See bump-homebrew-tap.yml: a GITHUB_TOKEN-created release does not fire
  # `release: published`; workflow_run on Release does.
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (no leading v)"
        required: true

permissions:
  contents: write

jobs:
  package:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            triple: x86_64-unknown-linux-gnu
          - arch: arm64
            triple: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch) v="$INPUT_VERSION" ;;
            workflow_run) v="$RUN_BRANCH" ;;
            *) v="$RELEASE_TAG" ;;
          esac
          v="${v#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Download the release tarball
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          base="https://github.com/$REPO/releases/download/v$VERSION"
          curl -sSL --fail -o tarball.tar.xz "$base/mnml-$TRIPLE.tar.xz"
          curl -sSL --fail -o tarball.tar.xz.sha256 "$base/mnml-$TRIPLE.tar.xz.sha256"
          # The sidecar names the asset; we saved it as tarball.tar.xz.
          echo "$(cut -d' ' -f1 tarball.tar.xz.sha256)  tarball.tar.xz" | sha256sum -c -
          tar -xJf tarball.tar.xz
          mkdir -p staging
          cp "mnml-$TRIPLE/mnml" staging/mnml
          chmod +x staging/mnml
          # The offline Jira and Bitbucket `mnml --demo` starts: beside
          # the binary in the archive, beside it at /usr/bin here.
          for fake in mnml-fake-jira mnml-fake-bitbucket; do
              test -f "mnml-$TRIPLE/$fake" || {
                  echo "the tarball has no $fake — scripts/package.sh did not stage it" >&2
                  exit 1
              }
              cp "mnml-$TRIPLE/$fake" "staging/$fake"
              chmod +x "staging/$fake"
          done
          # The curated Lua script set rides in the archive as
          # share/mnml/lua; nfpm lays it at /usr/share/mnml/lua, which is
          # where a /usr/bin binary looks for it.
          test -d "mnml-$TRIPLE/share/mnml/lua" || {
              echo "the tarball has no share/mnml/lua — scripts/package.sh did not stage it" >&2
              exit 1
          }
          cp -R "mnml-$TRIPLE/share/mnml/lua" staging/lua
          # MnmlSymbols.ttf rides the same way: the archive has it as
          # share/mnml/fonts, nfpm lays it at /usr/share/mnml/fonts.
          test -f "mnml-$TRIPLE/share/mnml/fonts/MnmlSymbols.ttf" || {
              echo "the tarball has no share/mnml/fonts/MnmlSymbols.ttf — scripts/package.sh did not stage it" >&2
              exit 1
          }
          mkdir -p staging/fonts
          cp "mnml-$TRIPLE/share/mnml/fonts/MnmlSymbols.ttf" staging/fonts/MnmlSymbols.ttf
          # The mnml catalogue — the INTEGRATIONS section's Marketplace
          # tab default source — rides the same way.
          test -f "mnml-$TRIPLE/share/mnml/marketplace.zon" || {
              echo "the tarball has no share/mnml/marketplace.zon — scripts/package.sh did not stage it" >&2
              exit 1
          }
          cp "mnml-$TRIPLE/share/mnml/marketplace.zon" staging/marketplace.zon
          ls -la staging/ staging/lua/ staging/fonts/

      - name: Install nfpm
        run: |
          curl -sSL --fail -o nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v2.40.0/nfpm_2.40.0_Linux_x86_64.tar.gz"
          mkdir -p .nfpm-bin
          tar -xzf nfpm.tar.gz -C .nfpm-bin nfpm
          chmod +x .nfpm-bin/nfpm
          .nfpm-bin/nfpm --version

      - name: Build .deb + .rpm
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.triple }}
        run: |
          .nfpm-bin/nfpm pkg --config nfpm/mnml.yaml --packager deb --target "mnml-$TRIPLE.deb"
          .nfpm-bin/nfpm pkg --config nfpm/mnml.yaml --packager rpm --target "mnml-$TRIPLE.rpm"
          ls -la ./*.deb ./*.rpm

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TRIPLE: ${{ matrix.triple }}
        run: gh release upload "v$VERSION" "mnml-$TRIPLE.deb" "mnml-$TRIPLE.rpm" --clobber
