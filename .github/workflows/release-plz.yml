# Automated releases via release-plz (https://release-plz.dev).
#
# Two jobs:
#   - release-plz-release  publishes to crates.io + tags + creates a GitHub
#     release when the PR from `release-plz-pr` is merged.
#   - release-plz-pr       opens / updates a "release PR" on every push to
#     `main` that bumps the version and updates CHANGELOG.md.
#
# Required repository secrets (Settings → Secrets → Actions):
#   CARGO_REGISTRY_TOKEN  — a crates.io API token (create via
#     https://crates.io/me; scope to "publish-new" + "publish-update").
#   (GITHUB_TOKEN is the default per-run token — already provided.)
#
# (fim-engine used to be a sibling requiring its own crates.io publish
# before this workflow. Now vendored as `crates/fim-engine/` — no
# external publish ordering needed.)

name: release-plz

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

# To enable: set repo variable RELEASE_PLZ_ENABLED=true via
# Settings → Secrets and variables → Actions → Variables tab.
# Also set the CARGO_REGISTRY_TOKEN secret (see above). Until both
# are set, this workflow runs but every job is skipped.

jobs:
  # Publishes crates + creates GitHub releases for any version bumps merged via
  # the release PR. Runs first so it can complete before a new PR opens.
  release-plz-release:
    if: vars.RELEASE_PLZ_ENABLED == 'true'
    name: Release-plz · release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # mnml-libghostty-vt-sys's build.rs source-builds libghostty-vt via
      # `zig build` and fails fast (require_tool_or_die) if zig isn't on
      # PATH. release-plz's publish step runs `cargo publish --dry-run` on
      # each crate, which invokes build.rs. Without zig here, the sys
      # crate's verify step aborts before reaching crates.io. Matches
      # ci.yml's setup step.
      - name: Install zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens or updates the "Release: vX.Y.Z" PR so a human can approve the bump
  # + CHANGELOG before anything gets published.
  release-plz-pr:
    if: vars.RELEASE_PLZ_ENABLED == 'true'
    name: Release-plz · open PR
    runs-on: ubuntu-latest
    needs: release-plz-release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # mnml-libghostty-vt-sys's build.rs source-builds libghostty-vt via
      # `zig build` and fails fast (require_tool_or_die) if zig isn't on
      # PATH. release-plz's publish step runs `cargo publish --dry-run` on
      # each crate, which invokes build.rs. Without zig here, the sys
      # crate's verify step aborts before reaching crates.io. Matches
      # ci.yml's setup step.
      - name: Install zig 0.16.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
