name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # macOS-arm64 + ubuntu-latest (x86_64) + windows-latest all run the
  # full suite. mnml-libghostty-vt-sys source-builds libghostty-vt via `zig build`
  # on every target (see the "Install zig 0.16.0" step below).
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # fim-engine used to be a sibling repo — vendored to `crates/fim-engine/`
      # as a workspace member 2026-08-11, so no external checkout needed
      # anymore. The `path: mnml` layout is preserved so downstream
      # `working-directory: mnml` steps don't need to change.
      - name: Checkout mnml
        uses: actions/checkout@v5
        with:
          path: mnml

      # 2026-08-02 — pkg-config prebuilt path retired (stale against the
      # newer ghostty commit under `vendor/libghostty-vt/include/`). All
      # three targets now go through mnml-libghostty-vt-sys's `source-build`
      # fallback: git-clone ghostty at the pinned commit + `zig build`.
      # Adds ~2-5 min to first-time builds; Swatinem/rust-cache below
      # keeps subsequent runs warm.
      - name: Install zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Windows: build for the `x86_64-pc-windows-gnu` (MinGW) target,
      # not the default `x86_64-pc-windows-msvc`. Upstream ghostty
      # explicitly marks msvc as "doesn't work yet" in their own CI
      # matrix (see test.yml `build-libghostty-vt-*`); the supported
      # combo is windows-gnu. MinGW-w64 GCC is preinstalled on
      # windows-latest runners under C:\ProgramData\mingw64, so
      # rustup only needs the target stdlib.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-gnu' || '' }}

      # Sanity-check that MinGW-w64 GCC (needed as the linker for the
      # -pc-windows-gnu target) is actually resolvable on PATH. Windows
      # runners preinstall it, but the specific path + PATH state can
      # drift between images — surfacing it here with a clear failure
      # beats a cryptic `linker gcc.exe not found` deep in a cargo build.
      - name: Sanity — MinGW-w64 GCC (Windows only)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          gcc --version
          which gcc
          which x86_64-w64-mingw32-gcc || echo "(x86_64-w64-mingw32-gcc unspecific — using bare gcc)"

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnml
          key: ${{ matrix.os }}

      - name: rustfmt
        working-directory: mnml
        run: cargo fmt --all --check

      - name: clippy
        working-directory: mnml
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

      - name: test
        working-directory: mnml
        # Windows: single-threaded + nocapture, so the crashing test's
        # NAME shows up in the log immediately before any crash.
        # Default parallel harness only prints "ok" after a test
        # completes, so a crashing test is invisible in the log —
        # makes bisection much harder. macOS/Linux stay parallel.
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cargo test --target x86_64-pc-windows-gnu -- --test-threads=1 --nocapture
          else
            cargo test
          fi
