name: CI

# Every `zig build` here runs with `-j2`: a hosted runner has 7 GB, and
# the ReleaseSafe cross-builds at full parallelism were killed by the
# memory killer after fifteen silent minutes (no error, just "Cleaning
# up orphan processes"). Two concurrent compile jobs fit; it is slower,
# and it finishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_corpus:
        description: "Also run the whole .test corpus on Linux (sharded four ways)"
        type: boolean
        default: false

# A newer push supersedes its own branch's or pull request's run still
# in flight — main included, which is pushed rarely. Stacked runs on the
# shared runner queue starved every other branch's jobs for half an hour.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout and build only; the token needs nothing but read.
permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # One heavy step per job, the jobs side by side. Every step recompiles,
  # and Zig compiles a test binary as one unit (every piece would import
  # the whole app), so the win is not splitting a binary: it is running
  # the independent steps as separate jobs at the same time. Measured in
  # run 36519762899, per step, when each platform ran them in series:
  #
  #   macos  (47 min): test Debug 12 · test ReleaseSafe 17 · build
  #                    ReleaseSafe 7 · -Dpartial=false 1 · three-size gate 7
  #   linux  (38 min): build 4 · -Dpartial=false 1 · test ReleaseSafe 30
  #   ubuntu check 25 · windows check 15 · gate-build cross 13–27
  #
  # Now: `unit` runs each platform's Debug and ReleaseSafe suites as six
  # jobs; `check` (macOS, Windows) is build + audits + gate; `linux` is
  # only the ReleaseSafe build the corpus shards and `linux-checks` run.
  # The ubuntu `check` leg is gone: its ReleaseSafe `test`, ReleaseSafe
  # build and -Dpartial=false were the `linux` job's own steps, run twice;
  # each now runs once (`unit` ubuntu/ReleaseSafe, `linux`, `linux-checks`),
  # and its Debug `test`, fmt and audits moved to `unit` / `linux` /
  # `linux-checks`. The longest job is the ubuntu ReleaseSafe suite
  # (~30 min), next to the cross builds (up to ~27).
  #
  # setup-zig's cache prefix holds the job id, so `check` and `linux` keep
  # their ids and cache keys (a warm cache for their build); `unit` and
  # `linux-checks` start cold on their first run.

  # The unit suites, one job per platform and optimize mode (Debug, and
  # ReleaseSafe — what ships). Leak = FAIL: every unit test runs on
  # std.testing.allocator. Windows runs the same command, pty and tui
  # suites included (build.zig adds them on every target); the tests that
  # need a real pty or tty skip themselves there.
  #
  # `test` is `unit` plus the one-size e2e gate. Windows and macOS run
  # Debug `unit` with every test's name streamed as it starts: the
  # suite's first Windows runs sat silent for fifty minutes on a test
  # nobody could name, and a macOS run then did the same for an hour
  # (2026-09-27, #4); their three-size gate runs in `check`, where its
  # lines stream too. macOS and Windows stream the ReleaseSafe `unit` as
  # well: #7's own run had the shipped-mode `test` binary fail with no
  # text and the step hang to its timeout, and Windows did the same on
  # 2026-09-29. ubuntu keeps `test` in both modes.
  unit:
    name: unit · ${{ matrix.optimize }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, optimize: Debug, step: test, timeout: 60 }
          - { os: ubuntu-latest, optimize: ReleaseSafe, step: test, timeout: 60 }
          - { os: macos-latest, optimize: Debug, step: unit -Dtest-trace=true -Dtest-trace-live=true, timeout: 60 }
          - { os: macos-latest, optimize: ReleaseSafe, step: unit -Dtest-trace=true -Dtest-trace-live=true, timeout: 60 }
          - { os: windows-latest, optimize: Debug, step: unit -Dtest-trace=true -Dtest-trace-live=true, timeout: 60 }
          # Streams each test's name, as macOS does: on 2026-09-29 this leg
          # hit its limit once and then had a test binary stop responding
          # for a minute, and neither log could name the test. `unit`, not
          # `test`: Windows' gate runs in `check` at all three sizes.
          # 60, not 40: this leg took 33-38 min on #16's runs.
          - { os: windows-latest, optimize: ReleaseSafe, step: unit -Dtest-trace=true -Dtest-trace-live=true, timeout: 60 }
    steps:
      - name: Checkout mnml-zig
        uses: actions/checkout@v7

      # setup-zig caches the global cache dir (~/.cache/zig on Linux/macOS,
      # %LOCALAPPDATA%\zig on Windows) itself — that is what `use-cache`
      # (default on) does — so there is no separate actions/cache step.
      # The key names the optimize mode: setup-zig cannot tell matrix legs
      # apart on its own, and the two modes share nothing compiled.
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.os }}-${{ matrix.optimize }}
          # setup-zig's default limit (2048 MB) is below what a ReleaseSafe
          # suite's cache grows to in a few runs; when it is passed the
          # action saves an EMPTY cache, and the next run starts cold: the
          # main test binary then starts at +30–39 min and the 40-minute
          # step limit was hit four times in the first week of October.
          # The limit is raised so the cache keeps the whole suite, and the
          # ReleaseSafe steps get the 60 minutes Windows already had.
          cache-size-limit: 6144

      # The dependency tree comes from github and three other hosts; one
      # dropped connection ("invalid HTTP response: HttpConnectionClosed")
      # failed a whole run once. Fetch it first, retried, so the build
      # steps below never touch the network. `zig build -l` runs the
      # configure phase, which is what fetches the lazy dependencies this
      # build graph asks for; `--fetch` alone skips those, and
      # `--fetch=all` pulls ~1 GB of ghostty's app-only packages.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1

      - name: zig build ${{ matrix.step }} -Doptimize=${{ matrix.optimize }}
        shell: bash
        timeout-minutes: ${{ matrix.timeout }}
        run: zig build -j2 ${{ matrix.step }} -Doptimize=${{ matrix.optimize }} --summary failures

  # macOS (arm64) and Windows (x86_64, -gnu): fmt, the ReleaseSafe build,
  # the audits, -Dpartial=false and the three-size gate. The gate stays
  # whole here rather than sharded like Linux's: on macOS this job
  # (~7 build + ~1 + ~7 gate) already finishes before that platform's
  # ReleaseSafe `unit` (~17), so shards would add runners and an artifact
  # round-trip without moving the wall time.
  check:
    name: build · audits · gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout mnml-zig
        uses: actions/checkout@v7

      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.os }}

      # Retried dependency fetch: see the `unit` job.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1

      - name: zig fmt --check
        shell: bash
        run: zig fmt --check build.zig build.zig.zon src themes tools integrations sdk

      # A string that dies at the next frame reaching a consumer that
      # outlives the frame (a menu label, a prompt title, a confirm
      # message, the screen's grapheme slices). `zig build test` runs the
      # same audit as a unit test; this step names the sites on failure.
      - name: zig build arena-audit (no frame-arena string outlives its frame)
        shell: bash
        run: zig build -j2 arena-audit --summary failures

      # Chrome a component owns, drawn by hand somewhere else: a box
      # glyph as a whole literal outside the frame modules, an
      # `if (ascii) "…" else "…"` pair a component already answers.
      # `zig build unit` runs the same walk; this step names the sites.
      - name: zig build chrome-audit (chrome is drawn through its component)
        shell: bash
        run: zig build -j2 chrome-audit --summary failures

      # Every spec id has a runner (D5): `-Dpartial=false` turns a missing
      # runner into a compile error.
      - name: zig build -Dpartial=false (every command id has a runner)
        shell: bash
        run: zig build -j2 -Dpartial=false --summary failures

      # ReleaseSafe on purpose: the `--gate` sweep below runs `.test`
      # files, and the corpus's timings are the shipped build's
      # (docs/CONTRIBUTING.md, "Run the corpus against an optimized
      # build") — the gate subset includes an integration file that is
      # timing-marginal in a Debug build. The Debug compile stays covered
      # by the `unit` job's Debug leg. It runs after -Dpartial=false,
      # whose Debug install lands in the same zig-out/bin/mnml-zig: in
      # the old order the gate ran that Debug exe, not this one.
      - name: zig build (ReleaseSafe — the build the gate runs against)
        shell: bash
        run: zig build -j2 -Doptimize=ReleaseSafe --summary failures

      # The Phase-0 gate (tools/gate.txt) at three sizes: content asserts at
      # 120x40; 80x24 and 200x60 assert no panic, no leak, no rect outside
      # its parent. Each file runs on a DebugAllocator with safety on.
      # Linux runs the same sweep split four ways, in the `corpus (shard
      # i/4)` jobs below.
      - name: mnml-zig test --gate --sizes 80x24,120x40,200x60
        shell: bash
        timeout-minutes: 40
        env:
          MNML_E2E_ALLOW_SHELL: "1"
        run: ./zig-out/bin/mnml-zig test --gate --sizes 80x24,120x40,200x60

      - name: mnml-zig --version
        shell: bash
        run: ./zig-out/bin/mnml-zig --version

  # Linux, natively — the ubuntu runner IS Linux, so no container here;
  # `tools/linux/run.sh` is the same sequence for a Mac. This job is only
  # the ReleaseSafe build, so the `corpus (shard i/4)` jobs and
  # `linux-checks` start as soon as it is packed; the ReleaseSafe unit
  # suite that used to sit in the middle of it (~30 min) is the `unit`
  # job's ubuntu/ReleaseSafe leg. The parts that only ever broke on Linux
  # were the corpus (a resolver error spelled differently, a filesystem
  # enumeration order) and the pty (a thread stack glibc refused).
  linux:
    name: linux (native) · ReleaseSafe build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: linux-native

      # Retried dependency fetch: see the `unit` job.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1

      - name: zig fmt --check
        run: zig fmt --check build.zig build.zig.zon src themes tools integrations sdk

      # Built for a baseline CPU: this build is unpacked and RUN on other
      # runners (the corpus shards, linux-checks), and a native build uses
      # instructions some of those machines lack — it died with SIGILL
      # (exit 132) on two of them. The release builds pin baseline too.
      - name: zig build -Doptimize=ReleaseSafe -Dcpu=baseline
        run: zig build -j2 -Doptimize=ReleaseSafe -Dcpu=baseline --summary failures

      - name: mnml-zig --version
        run: ./zig-out/bin/mnml-zig --version

      # The build the `corpus (shard i/4)` and `linux-checks` jobs run:
      # the whole install prefix — mnml-zig and everything the runner
      # finds beside it (the fake DAP / LSP / Copilot / Jira / Bitbucket
      # servers, the sample, Jira and Bitbucket integrations) plus share/.
      # Tarred, because an artifact does not keep the executable bit. What
      # the corpus reads from the checkout (tools/gate.txt, tests/e2e,
      # tools/shims, launchers, the repo itself for $MNML_REPO) is baked
      # into the binary as this checkout's absolute path, which is the
      # same path in every job of this repository.
      - name: pack zig-out for the corpus shards
        run: tar -czf zig-out-linux.tgz zig-out
      - name: upload zig-out
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-out-linux
          path: zig-out-linux.tgz
          retention-days: 1
          if-no-files-found: error

  # The rest of what `linux` did, plus the audits the ubuntu `check` leg
  # ran: the pty check against the ReleaseSafe build `linux` packed, then
  # the Debug build, -Dpartial=false, the audits and the integration
  # suites. The pty check runs first — the Debug installs below write the
  # same zig-out/bin/mnml-zig.
  linux-checks:
    name: linux (native) · pty · audits · integrations
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: linux-checks

      # Retried dependency fetch: see the `unit` job.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1

      - name: download zig-out
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zig-out-linux
      - name: unpack zig-out
        run: tar -xzf zig-out-linux.tgz && ./zig-out/bin/mnml-zig --version

      # A container and a runner both give a real pty; this is the only
      # place the terminal path (capability probe, mouse mode, SGR report,
      # the hit map at real coordinates) is exercised at all.
      - name: tools/pty-mouse-check.py
        run: python3 tools/pty-mouse-check.py

      - name: zig build
        run: zig build -j2 --summary failures

      - name: zig build -Dpartial=false
        run: zig build -j2 -Dpartial=false --summary failures

      - name: zig build glyph-audit
        run: zig build -j2 glyph-audit

      # Named sites on failure; `unit` runs the same walks as unit tests.
      - name: zig build arena-audit (no frame-arena string outlives its frame)
        run: zig build -j2 arena-audit --summary failures
      - name: zig build chrome-audit (chrome is drawn through its component)
        run: zig build -j2 chrome-audit --summary failures

      - name: the integration suites
        run: |
          (cd integrations/jira && zig build test --summary failures)
          (cd integrations/bitbucket && zig build test --summary failures)

  # The long sequential runner steps, split four ways, on the build the
  # `linux` job packed. They used to run one file after another inside
  # `linux` (the three-size gate, then the whole corpus behind the flag:
  # ~39 min for that job) and again inside `check` on ubuntu (the same
  # gate: ~43 min for that job). Files are independent — each gets its
  # own temp workspace and data root, and the offline fake servers bind
  # port 0 — so `mnml-zig test --shard i/4`
  # runs every fourth file of the runner's sorted list and the four jobs
  # between them run each file exactly once. Measured on an 18-core Mac:
  # the 1100-file corpus took ~57 min sequentially and 265 s as twelve
  # parallel shards, with a byte-identical set of verdicts. Each job's
  # trailer ends `, shard i/4`, so a failure names its slice.
  corpus:
    name: corpus (shard ${{ matrix.shard }}/4)
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: download zig-out
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zig-out-linux
      - name: unpack zig-out
        run: tar -xzf zig-out-linux.tgz && ./zig-out/bin/mnml-zig --version

      - name: mnml-zig test --gate --sizes 80x24,120x40,200x60 --shard ${{ matrix.shard }}/4
        timeout-minutes: 40
        env:
          MNML_E2E_ALLOW_SHELL: "1"
        run: ./zig-out/bin/mnml-zig test --gate --sizes 80x24,120x40,200x60 --shard ${{ matrix.shard }}/4

      - name: the whole corpus (shard ${{ matrix.shard }}/4)
        if: ${{ inputs.linux_corpus }}
        timeout-minutes: 60
        env:
          MNML_E2E_ALLOW_SHELL: "1"
        run: ./zig-out/bin/mnml-zig test --shard ${{ matrix.shard }}/4

  # Cross-compile the exe and every test binary for each shipped target
  # (E7): Zig only analyses target-gated code when that target is built, so
  # a `builtin.os.tag == .windows` branch that does not compile is invisible
  # until someone builds Windows. ReleaseSafe, not Debug — Zig 0.16.0's Debug
  # codegen hits a `writeToPackedMemory` TODO when cross-compiling the test
  # binaries for x86_64, and ReleaseSafe is the mode that ships anyway.
  # `zig build gate-targets` is the local twin (all five, in sequence;
  # `./run.sh check` runs it).
  cross:
    name: gate-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - x86_64-macos
          # aarch64-macos is not cross-built here: on the 7 GB ubuntu
          # runner that entry was killed for memory after 23 silent
          # minutes even at -j2, and it would only repeat work macos-latest
          # (arm64) already does natively — the ReleaseSafe `unit` leg and
          # `check`'s ReleaseSafe `zig build` compile the exe and every
          # test binary gate-build installs.
    steps:
      - uses: actions/checkout@v7
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: cross-${{ matrix.target }}

      # The dependency tree comes from github and three other hosts; one
      # dropped connection ("invalid HTTP response: HttpConnectionClosed")
      # failed a whole run once. Fetch it first, retried, so the build
      # steps below never touch the network. `zig build -l` runs the
      # configure phase, which is what fetches the lazy dependencies this
      # build graph asks for; `--fetch` alone skips those, and
      # `--fetch=all` pulls ~1 GB of ghostty's app-only packages.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      # Swap, so a compile that outgrows the runner's RAM slows down
      # instead of the runner being shut down: aarch64 died that way
      # (exit 143, "the runner has received a shutdown signal", 13-18 min
      # in, no compiler error) on three of four runs on 2026-09-29, and
      # passed in 24-31 min on the others. `free` before and after shows
      # how close it came.
      - name: Add swap
        run: |
          free -h
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/ci-swapfile
          sudo chmod 600 /mnt/ci-swapfile
          sudo mkswap /mnt/ci-swapfile
          sudo swapon /mnt/ci-swapfile
          free -h
      # -j1: one ReleaseSafe LLVM compile of the exe peaks at 9 GB for
      # aarch64 (measured locally), and gate-build has six of that size;
      # two at once is what the runner was shut down for at 12 minutes.
      - name: zig build gate-build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
        run: zig build -j1 gate-build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --summary failures
      - name: What was built
        run: |
          ls -la zig-out/gate/
          free -h
