name: CI

# Every `zig build` here runs with `-j2`: a hosted runner has 7 GB, and
# the ReleaseSafe cross-builds at full parallelism were killed by the
# memory killer after fifteen silent minutes (no error, just "Cleaning
# up orphan processes"). Two concurrent compile jobs fit; it is slower,
# and it finishes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_corpus:
        description: "Also run the whole .test corpus on Linux (sharded four ways)"
        type: boolean
        default: false

# A newer push supersedes its own branch's or pull request's run still
# in flight — main included, which is pushed rarely. Stacked runs on the
# shared runner queue starved every other branch's jobs for half an hour.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout and build only; the token needs nothing but read.
permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  # ubuntu (x86_64) · macos (arm64) · windows (x86_64, -gnu) each run the
  # whole thing: fmt, the unit suite in both optimize modes that matter
  # (Debug, and ReleaseSafe — what ships), the .test gate at three sizes.
  check:
    name: fmt · test · gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout mnml-zig
        uses: actions/checkout@v7

      # setup-zig caches the global cache dir (~/.cache/zig on Linux/macOS,
      # %LOCALAPPDATA%\zig on Windows) itself — that is what `use-cache`
      # (default on) does — so there is no separate actions/cache step.
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ${{ matrix.os }}

      # The dependency tree comes from github and three other hosts; one
      # dropped connection ("invalid HTTP response: HttpConnectionClosed")
      # failed a whole run once. Fetch it first, retried, so the build
      # steps below never touch the network. `zig build -l` runs the
      # configure phase, which is what fetches the lazy dependencies this
      # build graph asks for; `--fetch` alone skips those, and
      # `--fetch=all` pulls ~1 GB of ghostty's app-only packages.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1

      - name: zig fmt --check
        shell: bash
        run: zig fmt --check build.zig build.zig.zon src themes tools integrations sdk

      # Leak = FAIL: every unit test runs on std.testing.allocator. Windows
      # runs the same command; the POSIX-gated pty / tui suites are simply
      # not in its graph (build.zig, `pty_supported`).
      # Windows and macOS run `unit` with every test's name streamed as it
      # starts: the suite's first Windows runs sat silent for fifty minutes
      # on a test nobody could name, and a macOS run then did the same for
      # an hour (2026-09-27, #4). The e2e gate that `test` adds runs as its
      # own step below, where its lines stream too; ubuntu keeps `test`.
      - name: zig build test (Debug)
        shell: bash
        timeout-minutes: 60
        run: zig build -j2 ${{ matrix.os != 'ubuntu-latest' && 'unit -Dtest-trace=true -Dtest-trace-live=true' || 'test' }} -Doptimize=Debug --summary failures

      # macOS: the same streamed `unit` in ReleaseSafe. #7's own run had
      # the shipped-mode `test` binary fail with no text and the step hang
      # to its timeout; the ReleaseSafe gate runs as the `--gate` step below.
      - name: zig build test (ReleaseSafe — what ships)
        shell: bash
        timeout-minutes: 40
        run: zig build -j2 ${{ matrix.os == 'macos-latest' && 'unit -Dtest-trace=true -Dtest-trace-live=true' || 'test' }} -Doptimize=ReleaseSafe --summary failures

      # ReleaseSafe on purpose: the `--gate` sweep below runs `.test`
      # files, and the corpus's timings are the shipped build's
      # (docs/CONTRIBUTING.md, "Run the corpus against an optimized
      # build") — the gate subset includes an integration file that is
      # timing-marginal in a Debug build. The Debug compile stays covered
      # by the `zig build test -Doptimize=Debug` step above.
      - name: zig build (ReleaseSafe — the build the gate runs against)
        shell: bash
        run: zig build -j2 -Doptimize=ReleaseSafe --summary failures

      # A string that dies at the next frame reaching a consumer that
      # outlives the frame (a menu label, a prompt title, a confirm
      # message, the screen's grapheme slices). `zig build test` runs the
      # same audit as a unit test; this step names the sites on failure.
      - name: zig build arena-audit (no frame-arena string outlives its frame)
        shell: bash
        run: zig build -j2 arena-audit --summary failures

      # Chrome a component owns, drawn by hand somewhere else: a box
      # glyph as a whole literal outside the frame modules, an
      # `if (ascii) "…" else "…"` pair a component already answers.
      # `zig build unit` runs the same walk; this step names the sites.
      - name: zig build chrome-audit (chrome is drawn through its component)
        shell: bash
        run: zig build -j2 chrome-audit --summary failures

      # Every spec id has a runner (D5): `-Dpartial=false` turns a missing
      # runner into a compile error.
      - name: zig build -Dpartial=false (every command id has a runner)
        shell: bash
        run: zig build -j2 -Dpartial=false --summary failures

      # The Phase-0 gate (tools/gate.txt) at three sizes: content asserts at
      # 120x40; 80x24 and 200x60 assert no panic, no leak, no rect outside
      # its parent. Each file runs on a DebugAllocator with safety on.
      # Not on ubuntu: the same ReleaseSafe build runs the same sweep there,
      # split four ways, in the `corpus (shard i/4)` jobs below.
      - name: mnml-zig test --gate --sizes 80x24,120x40,200x60
        if: ${{ matrix.os != 'ubuntu-latest' }}
        shell: bash
        timeout-minutes: 40
        env:
          MNML_E2E_ALLOW_SHELL: "1"
        run: ./zig-out/bin/mnml-zig test --gate --sizes 80x24,120x40,200x60

      - name: mnml-zig --version
        shell: bash
        run: ./zig-out/bin/mnml-zig --version

  # Linux, natively — the ubuntu runner IS Linux, so no container here;
  # `tools/linux/run.sh` is the same sequence for a Mac. It earns its own
  # job because the `check` matrix above stops at the gate: the parts that
  # only ever broke on Linux were the corpus (a resolver error spelled
  # differently, a filesystem enumeration order) and the pty (a thread
  # stack glibc refused). Build + unit + mouse + integration suites here;
  # the three-size gate always and the corpus behind the workflow_dispatch
  # flag run from this job's build in the `corpus (shard i/4)` jobs.
  linux:
    name: linux (native) · gate · pty · corpus?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: linux-native

      # The dependency tree comes from github and three other hosts; one
      # dropped connection ("invalid HTTP response: HttpConnectionClosed")
      # failed a whole run once. Fetch it first, retried, so the build
      # steps below never touch the network. `zig build -l` runs the
      # configure phase, which is what fetches the lazy dependencies this
      # build graph asks for; `--fetch` alone skips those, and
      # `--fetch=all` pulls ~1 GB of ghostty's app-only packages.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1

      - name: zig build
        run: zig build -j2 --summary failures

      - name: zig build -Dpartial=false
        run: zig build -j2 -Dpartial=false --summary failures

      - name: zig build glyph-audit
        run: zig build -j2 glyph-audit

      - name: zig build test -Doptimize=ReleaseSafe
        run: zig build -j2 test -Doptimize=ReleaseSafe --summary failures

      - name: zig build -Doptimize=ReleaseSafe
        run: zig build -j2 -Doptimize=ReleaseSafe --summary failures

      # The build the `corpus (shard i/4)` jobs run: the whole install
      # prefix — mnml-zig and everything the runner finds beside it (the
      # fake DAP / LSP / Copilot / Jira / Bitbucket servers, the sample,
      # Jira and Bitbucket integrations) plus share/. Tarred, because an
      # artifact does not keep the executable bit. What the corpus reads
      # from the checkout (tools/gate.txt, tests/e2e, tools/shims,
      # launchers, the repo itself for $MNML_REPO) is baked into the
      # binary as this checkout's absolute path, which is the same path
      # in every job of this repository.
      - name: pack zig-out for the corpus shards
        run: tar -czf zig-out-linux.tgz zig-out
      - name: upload zig-out
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zig-out-linux
          path: zig-out-linux.tgz
          retention-days: 1
          if-no-files-found: error

      # A container and a runner both give a real pty; this is the only
      # place the terminal path (capability probe, mouse mode, SGR report,
      # the hit map at real coordinates) is exercised at all.
      - name: tools/pty-mouse-check.py
        run: python3 tools/pty-mouse-check.py

      - name: the integration suites
        run: |
          (cd integrations/jira && zig build test --summary failures)
          (cd integrations/bitbucket && zig build test --summary failures)

  # The long sequential runner steps, split four ways. They used to run
  # one file after another inside `linux` (the three-size gate, then the
  # whole corpus behind the flag: ~39 min for that job) and again inside
  # `check` on ubuntu (the same gate: ~43 min for that job). Files are
  # independent — each gets its own temp workspace and data root, and the
  # offline fake servers bind port 0 — so `mnml-zig test --shard i/4`
  # runs every fourth file of the runner's sorted list and the four jobs
  # between them run each file exactly once. Measured on an 18-core Mac:
  # the 1100-file corpus took ~57 min sequentially and 265 s as twelve
  # parallel shards, with a byte-identical set of verdicts. Each job's
  # trailer ends `, shard i/4`, so a failure names its slice.
  corpus:
    name: corpus (shard ${{ matrix.shard }}/4)
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: download zig-out
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zig-out-linux
      - name: unpack zig-out
        run: tar -xzf zig-out-linux.tgz && ./zig-out/bin/mnml-zig --version

      - name: mnml-zig test --gate --sizes 80x24,120x40,200x60 --shard ${{ matrix.shard }}/4
        timeout-minutes: 40
        env:
          MNML_E2E_ALLOW_SHELL: "1"
        run: ./zig-out/bin/mnml-zig test --gate --sizes 80x24,120x40,200x60 --shard ${{ matrix.shard }}/4

      - name: the whole corpus (shard ${{ matrix.shard }}/4)
        if: ${{ inputs.linux_corpus }}
        timeout-minutes: 60
        env:
          MNML_E2E_ALLOW_SHELL: "1"
        run: ./zig-out/bin/mnml-zig test --shard ${{ matrix.shard }}/4

  # Cross-compile the exe and every test binary for each shipped target
  # (E7): Zig only analyses target-gated code when that target is built, so
  # a `builtin.os.tag == .windows` branch that does not compile is invisible
  # until someone builds Windows. ReleaseSafe, not Debug — Zig 0.16.0's Debug
  # codegen hits a `writeToPackedMemory` TODO when cross-compiling the test
  # binaries for x86_64, and ReleaseSafe is the mode that ships anyway.
  # `zig build gate-targets` is the local twin (all five, in sequence;
  # `./run.sh check` runs it).
  cross:
    name: gate-build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-windows-gnu
          - x86_64-macos
          # aarch64-macos is not cross-built here: on the 7 GB ubuntu
          # runner that entry was killed for memory after 23 silent
          # minutes even at -j2, and it would only repeat work the
          # `check` job on macos-latest (arm64) already does natively —
          # its ReleaseSafe `zig build test` and `zig build` compile the
          # exe and every test binary gate-build installs.
    steps:
      - uses: actions/checkout@v7
      - name: Install zig ${{ env.ZIG_VERSION }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: cross-${{ matrix.target }}

      # The dependency tree comes from github and three other hosts; one
      # dropped connection ("invalid HTTP response: HttpConnectionClosed")
      # failed a whole run once. Fetch it first, retried, so the build
      # steps below never touch the network. `zig build -l` runs the
      # configure phase, which is what fetches the lazy dependencies this
      # build graph asks for; `--fetch` alone skips those, and
      # `--fetch=all` pulls ~1 GB of ghostty's app-only packages.
      - name: Fetch dependencies (retried)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            zig build -l -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe > /dev/null && exit 0
            echo "::warning::dependency fetch attempt $i failed; retrying in $((i * 15))s"
            sleep $((i * 15))
          done
          exit 1
      # -j1: one ReleaseSafe LLVM compile of the exe peaks at 9 GB for
      # aarch64 (measured locally), and gate-build has six of that size;
      # two at once is what the runner was shut down for at 12 minutes.
      - name: zig build gate-build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
        run: zig build -j1 gate-build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --summary failures
      - name: What was built
        run: ls -la zig-out/gate/
