name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # macOS-arm64 + ubuntu-latest (x86_64) + windows-latest all run the
  # full suite. mnml-vt-sys source-builds libghostty-vt via `zig build`
  # on every target (see the "Install zig 0.15.2" step below).
  check:
    name: fmt · clippy · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # mnml depends on the fim-engine sibling crate by path (../fim-engine),
      # so check it out alongside this repo for the path dep to resolve.
      - name: Checkout mnml
        uses: actions/checkout@v4
        with:
          path: mnml
      - name: Checkout fim-engine
        uses: actions/checkout@v4
        with:
          repository: chris-mclennan/fim-engine
          path: fim-engine

      # 2026-08-02 — pkg-config prebuilt path retired (stale against the
      # newer ghostty commit under `vendor/libghostty-vt/include/`). All
      # three targets now go through mnml-vt-sys's `source-build`
      # fallback: git-clone ghostty at the pinned commit + `zig build`.
      # Adds ~2-5 min to first-time builds; Swatinem/rust-cache below
      # keeps subsequent runs warm.
      - name: Install zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mnml
          key: ${{ matrix.os }}

      - name: rustfmt
        working-directory: mnml
        run: cargo fmt --all --check

      - name: clippy
        working-directory: mnml
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        working-directory: mnml
        run: cargo test
