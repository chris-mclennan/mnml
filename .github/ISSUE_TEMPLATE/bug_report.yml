name: Bug report
description: Something in fim-engine isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you call, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: fim-engine version
      description: The crate version or commit SHA.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Which stage?
      options:
        - "Model download (FimEngine::load)"
        - "Inference (FimEngine::complete)"
        - Build / features
        - Not sure
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS & device
      description: e.g. "macOS 15.4, Apple Silicon (metal)" or "Linux, CPU (--no-default-features)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any relevant output or error text.
      render: shell
