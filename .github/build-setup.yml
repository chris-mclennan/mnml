# Injected by `dist` into every build-local-artifacts job's `steps:`
# array, before the actual build runs. Handles the Linux system libs
# that tree-sitter, fontconfig, and OpenSSL build-time depend on.
# macOS + Windows runners have these bundled already; only Linux
# needs the apt-get step.
#
# fim-engine used to be a sibling repo cloned here into `../fim-engine/`.
# Vendored to `crates/fim-engine/` as a workspace member 2026-08-11 —
# the external clone step went with it. Reintroduce it here if
# fim-engine ever moves back out.

- name: Install Linux build deps
  if: runner.os == 'Linux'
  shell: bash
  run: |
    # cross-rs containers run as root without sudo; bare ubuntu runners
    # need sudo. Detect either.
    SUDO=
    if command -v sudo >/dev/null 2>&1; then SUDO=sudo; fi
    $SUDO apt-get update
    $SUDO apt-get install -y \
      libfontconfig1-dev libssl-dev pkg-config
