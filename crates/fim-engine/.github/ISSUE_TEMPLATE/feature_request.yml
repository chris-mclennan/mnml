name: Feature request
description: Suggest an idea or improvement for fim-engine.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case or pain point behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you'd like fim-engine to do — a new model choice, an API change, a perf improvement.
    validations:
      required: true
