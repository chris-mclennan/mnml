[package]
name = "mnml-vt-sys"
version = "0.2.0"
edition = "2024"
authors = ["Chris McLennan"]
license = "MIT OR Apache-2.0"
description = "Raw FFI bindings to Ghostty's libghostty-vt (the C API in include/ghostty/vt.h)."
repository = "https://github.com/chris-mclennan/mnml"
readme = "README.md"
# Bindings are generated by bindgen against vendored headers under
# `vendor/libghostty-vt/include/ghostty/vt/` (workspace root). Linking
# goes through pkg-config against the vendored prebuilt static .a
# (see `vendor/libghostty-vt/pkgconfig-*`).
#
links = "ghostty-vt"

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[features]
default = ["pkg-config"]
# Consume the vendored prebuilt .a via pkg-config. This is what mnml's
# .cargo/config.toml wires up per target — no Zig toolchain required.
pkg-config = []

[package.metadata.docs.rs]
# docs.rs has no libghostty-vt.a nor pkg-config wiring, so skip the actual
# link step. Consumers of docs only need the bindings' surface.
no-default-features = true
