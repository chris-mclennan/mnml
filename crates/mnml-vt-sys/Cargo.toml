[package]
name = "mnml-vt-sys"
version = "0.2.0"
edition = "2024"
authors = ["Chris McLennan"]
license = "MIT OR Apache-2.0"
description = "Raw FFI bindings to Ghostty's libghostty-vt (the C API in include/ghostty/vt.h)."
repository = "https://github.com/chris-mclennan/mnml"
readme = "README.md"
# Bindings are generated by bindgen against vendored headers under
# `vendor/libghostty-vt/include/ghostty/vt/` (workspace root). Linking
# goes through pkg-config against the vendored prebuilt static .a
# (see `vendor/libghostty-vt/pkgconfig-*`).
#
links = "ghostty-vt"

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[features]
# Both link paths are enabled by default and tried in order:
#   1. `pkg-config` — resolve `libghostty-vt-static` via `PKG_CONFIG_PATH`
#      (Linux + macOS use the vendored prebuilt under `vendor/libghostty-vt/`
#      wired up in `.cargo/config.toml`)
#   2. `source-build` — git-clone ghostty at a pinned commit into `OUT_DIR`
#      and run `zig build`. Requires zig 0.15.2 + git on PATH. Used by
#      Windows CI (no vendored `.a`) and any dev who wants to iterate on
#      a local ghostty checkout via `GHOSTTY_SOURCE_DIR`.
#
# Downstream callers can pick one explicitly with
# `--no-default-features --features pkg-config` etc.
default = ["pkg-config", "source-build"]
pkg-config = []
source-build = []

[package.metadata.docs.rs]
# docs.rs has no libghostty-vt.a nor pkg-config wiring, so skip the actual
# link step. Consumers of docs only need the bindings' surface.
no-default-features = true
