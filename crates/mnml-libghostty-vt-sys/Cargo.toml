[package]
name = "mnml-libghostty-vt-sys"
version = "0.2.2"
edition = "2024"
authors = ["Chris McLennan"]
license = "MIT OR Apache-2.0"
description = "Raw FFI bindings to Ghostty's libghostty-vt (the C API in include/ghostty/vt.h)."
repository = "https://github.com/chris-mclennan/mnml"
readme = "README.md"
# Bindings are generated by bindgen against vendored headers under
# `vendor/libghostty-vt/include/ghostty/vt/` (workspace root). The
# static `.a` is source-built at build time: build.rs clones ghostty
# at GHOSTTY_COMMIT and runs `zig build -Demit-lib-vt`. Needs zig
# 0.15.2 + git on PATH. The retained `pkg-config` feature can consume
# a prebuilt `.pc` if one's on PKG_CONFIG_PATH (nothing checked in
# today; see vendor/libghostty-vt/README.md).
links = "ghostty-vt"

[lib]
name = "libghostty_vt_sys"
path = "src/lib.rs"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[features]
# Both link paths are enabled by default and tried in order:
#   1. `pkg-config` — resolve `libghostty-vt-static` via `PKG_CONFIG_PATH`.
#      No-op today (nothing checked in ships a `.pc`); retained so a future
#      prebuilt setup, or a downstream dev bringing their own, can plug in
#      without changing this crate.
#   2. `source-build` — git-clone ghostty at GHOSTTY_COMMIT into `OUT_DIR`
#      and run `zig build`. Requires zig 0.15.2 + git on PATH. This is
#      the live path on every target as of 2026-08-02. Devs iterating on
#      a local ghostty checkout can point `GHOSTTY_SOURCE_DIR` at it.
#
# Downstream callers can pick one explicitly with
# `--no-default-features --features pkg-config` etc.
default = ["pkg-config", "source-build"]
pkg-config = []
source-build = []

[package.metadata.docs.rs]
# docs.rs has no libghostty-vt.a nor pkg-config wiring, so skip the actual
# link step. Consumers of docs only need the bindings' surface.
no-default-features = true
